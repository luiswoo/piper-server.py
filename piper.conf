# Обязательная проверка наличия утилиты (если ее нет, модуль не запустится)
GenericCmdDependency "curl"

# Команда синтеза: используем одинарные кавычки вокруг $DATA, чтобы шелл не ломался на спецсимволах
GenericExecuteSynth \
"printf '%s' '$DATA' | /home/user/.local/bin/piper-spd-wrapper.sh $RATE" # или /home/user/piper-spd-wrapper.sh

# Обязательная привязка языка (без этого sd_generic отбрасывает запросы с -l ru!)
GenericLanguage "ru" "ru" "utf-8"

# Настройка диапазона скорости
GenericRateAdd 0
GenericRateMultiply 100
GenericRateForceInteger 1

# Заглушки для высоты тона и громкости
GenericPitchAdd 0
GenericPitchMultiply 100
GenericVolumeAdd 0
GenericVolumeMultiply 100

# Регистрация голоса
AddVoice "ru" "FEMALE1" "Piper-Dynamic"
DefaultVoice "Piper-Dynamic"

# Экранирование кавычек внутри $DATA (критично для одинарных кавычек в GenericExecuteSynth)
GenericDelimiters "."
