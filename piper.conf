GenericCmdDependency "curl"

GenericExecuteSynth "printf '%s' \"$DATA\" | /home/username/.local/bin/piper-spd-wrapper.sh $RATE" # или из /home/username/piper-spd-wrapper.sh

# Покрываем все варианты регистра для русского, а также en/en-US (если плагин шлет русский текст с английским тегом)
GenericLanguage "ru" "ru_RU" "UTF-8"
GenericLanguage "ru-RU" "ru_RU" "UTF-8"
GenericLanguage "ru-Ru" "ru_RU" "UTF-8"
GenericLanguage "ru_RU" "ru_RU" "UTF-8"
GenericLanguage "en" "en_US" "UTF-8"
GenericLanguage "en-US" "en_US" "UTF-8"

AddVoice "ru" "MALE1" "denis"
AddVoice "ru-RU" "MALE1" "denis"
AddVoice "ru-Ru" "MALE1" "denis"
AddVoice "ru_RU" "MALE1" "denis"
DefaultVoice "denis"

GenericRateAdd 0
GenericRateMultiply 1
GenericRateForceInteger 1

GenericPitchAdd 0
GenericPitchMultiply 100
GenericVolumeAdd 0
GenericVolumeMultiply 100
